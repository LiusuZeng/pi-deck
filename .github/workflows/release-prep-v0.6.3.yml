name: Prepare v0.6.3 release metadata

on:
  push:
    branches:
      - release/v0.6.3

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.3
          fetch-depth: 0

      - name: Generate release metadata
        run: node scripts/release-prep-v0.6.3.mjs

      - name: Validate generated metadata
        run: |
          git diff --check
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='0.6.3'||l.version!=='0.6.3'||l.packages[''].version!=='0.6.3') process.exit(1)"
          grep -q 'data-release-version="0.6.3"' site/index.html
          grep -q '\[0.6.3\]' CHANGELOG.md
          test -f docs/reviews/v0.6.3-github-release-notes.md

      - name: Commit generated release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json site/index.html docs/reviews/v0.6.3-github-release-notes.md
          git commit -m "release: prepare Pi Deck v0.6.3"
          git push origin HEAD:release/v0.6.3
