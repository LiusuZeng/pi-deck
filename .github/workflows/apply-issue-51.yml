name: Apply issue 51 implementation

on:
  push:
    branches: [perf/issue-51-progressive-startup]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/issue-51-progressive-startup
      - name: Apply progressive-startup implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          helper = '''export interface ProgressiveStartupTimings {
            shellReadyMs: number;
            backendReadyMs: number;
          }

          export interface ProgressiveStartupOptions {
            startedAtMs: number;
            now(): number;
            schedule(callback: () => void): void;
            prepareShell(): void;
            initializeBackend(): Promise<void>;
          }

          /**
           * Creates the visible shell synchronously, then releases heavyweight
           * backend initialization on the caller-provided scheduler. Keeping the
           * scheduler injectable makes startup ordering deterministic in tests.
           */
          export function startProgressiveStartup(
            options: ProgressiveStartupOptions,
          ): {
            shellReadyMs: number;
            backendReady: Promise<ProgressiveStartupTimings>;
          } {
            let releaseBackend: (() => void) | undefined;
            const backendStart = new Promise<void>((resolve) => {
              releaseBackend = resolve;
            });
            const backendReady = backendStart.then(async () => {
              await options.initializeBackend();
              return {
                shellReadyMs: Math.max(0, shellReadyAtMs - options.startedAtMs),
                backendReadyMs: Math.max(0, options.now() - options.startedAtMs),
              };
            });

            options.prepareShell();
            const shellReadyAtMs = options.now();
            const startBackend = releaseBackend;
            if (startBackend === undefined) {
              throw new Error("Progressive startup backend gate was not initialized.");
            }
            options.schedule(startBackend);

            return {
              shellReadyMs: Math.max(0, shellReadyAtMs - options.startedAtMs),
              backendReady,
            };
          }
          '''
          Path('src/main/progressiveStartup.ts').write_text(helper)

          test = '''import { describe, expect, it } from "vitest";
          import { startProgressiveStartup } from "./progressiveStartup.js";

          describe("progressive startup", () => {
            it("prepares the shell before scheduled backend initialization", async () => {
              const order: string[] = [];
              let now = 100;
              let scheduled: (() => void) | undefined;
              const startup = startProgressiveStartup({
                startedAtMs: 90,
                now: () => now,
                schedule: (callback) => {
                  scheduled = callback;
                },
                prepareShell: () => {
                  order.push("shell");
                  now = 105;
                },
                initializeBackend: async () => {
                  order.push("backend");
                  now = 140;
                },
              });

              expect(order).toEqual(["shell"]);
              expect(startup.shellReadyMs).toBe(15);
              expect(scheduled).toBeTypeOf("function");

              scheduled?.();
              const timings = await startup.backendReady;
              expect(order).toEqual(["shell", "backend"]);
              expect(timings).toEqual({
                shellReadyMs: 15,
                backendReadyMs: 50,
              });
            });

            it("keeps shell preparation independent from backend failure", async () => {
              let shellPrepared = false;
              let scheduled: (() => void) | undefined;
              const startup = startProgressiveStartup({
                startedAtMs: 0,
                now: () => 1,
                schedule: (callback) => {
                  scheduled = callback;
                },
                prepareShell: () => {
                  shellPrepared = true;
                },
                initializeBackend: async () => {
                  throw new Error("backend failed");
                },
              });

              expect(shellPrepared).toBe(true);
              scheduled?.();
              await expect(startup.backendReady).rejects.toThrow("backend failed");
            });
          });
          '''
          Path('src/main/progressiveStartup.test.ts').write_text(test)

          path = Path('src/main/main.ts')
          text = path.read_text()
          anchor = 'import { ProjectStore, resolvePiDeckHome } from "./projects/projectStore.js";\n'
          replacement = anchor + 'import { startProgressiveStartup } from "./progressiveStartup.js";\n'
          assert text.count(anchor) == 1, 'progressive startup import anchor missing'
          text = text.replace(anchor, replacement, 1)

          globals_anchor = '''let workflowScheduler: WorkflowScheduler | undefined;
          let workflowOccurrenceScheduler: WorkflowOccurrenceScheduler | undefined;
          '''
          globals_replacement = '''let workflowScheduler: WorkflowScheduler | undefined;
          let workflowOccurrenceScheduler: WorkflowOccurrenceScheduler | undefined;
          let backendInitializationPromise: Promise<void> | undefined;
          const processStartedAtMs = Date.now();
          '''
          assert text.count(globals_anchor) == 1, 'startup globals anchor missing'
          text = text.replace(globals_anchor, globals_replacement, 1)

          bootstrap_pattern = re.compile(r'async function bootstrap\(\): Promise<void> \{.*?\n\}\n\nfunction createMainWindow\(\): void \{', re.S)
          bootstrap_replacement = '''async function bootstrap(): Promise<void> {
            const userDataOverride = process.env.PI_DECK_USER_DATA_DIR;
            if (userDataOverride !== undefined && userDataOverride.trim().length > 0) {
              app.setPath("userData", path.resolve(userDataOverride));
            }

            await app.whenReady();

            if (process.platform === "darwin") {
              const dock = app.dock;
              if (dock) {
                initializeMacOSDockIcon({
                  platform: process.platform,
                  dock,
                  iconPath: resolveAppIconPath({
                    isDev,
                    appPath: app.getAppPath(),
                    mainDirectory: __dirname,
                  }),
                  nativeImage,
                });
              }
            }

            const diagnosticsService = new DiagnosticsService(
              app.getVersion(),
              app.getPath("userData"),
            );
            diagnostics = diagnosticsService;
            const settings = new SettingsStore(
              app.getPath("userData"),
              diagnosticsService,
            );
            settingsStore = settings;
            // Theme is the one persisted dependency that must precede first paint.
            await settings.loadIfNeeded();
            applyAppTheme(await settings.get());
            nativeTheme.on("updated", () => {
              updateWindowBackground(mainWindow, nativeTheme);
            });

            const projects = new ProjectStore(
              resolvePiDeckHome(process.env),
              diagnosticsService,
            );
            projectStore = projects;
            const multitask = new MultitaskStateStore(app.getPath("userData"));
            multitaskStateStore = multitask;
            const taskSessions = new TaskSessionMainStateStore(
              app.getPath("userData"),
            );
            taskSessionStateStore = taskSessions;
            const workspacesStore = new WorkspaceStore(
              resolvePiDeckHome(process.env),
              diagnosticsService,
            );
            workspaceStore = workspacesStore;
            const usageStore = new WorkspaceUsageStore(resolvePiDeckHome(process.env));
            workspaceUsageStore = usageStore;

            const startup = startProgressiveStartup({
              startedAtMs: processStartedAtMs,
              now: Date.now,
              schedule: (callback) => setImmediate(callback),
              prepareShell: () => {
                configureCsp();
                registerIpcHandlers(settings, diagnosticsService);
                createMainWindow();
                app.on("activate", () => {
                  if (BrowserWindow.getAllWindows().length === 0) {
                    createMainWindow();
                  }
                });
              },
              initializeBackend: async () => {
                await Promise.all([
                  diagnosticsService.initialize(),
                  multitask.loadIfNeeded(),
                  taskSessions.loadIfNeeded(),
                  projects.loadIfNeeded(),
                  workspacesStore.loadIfNeeded(),
                  usageStore.loadIfNeeded(),
                ]);

                workflowInitialization = await initializeWorkflows(async () => {
                  const store = new WorkflowStore(
                    resolvePiDeckHome(process.env),
                    diagnosticsService,
                  );
                  await store.loadIfNeeded();
                  return store;
                });
                if (workflowInitialization.status === "available") {
                  workflowScheduler = createWorkflowScheduler(settings, diagnosticsService);
                  workflowOccurrenceScheduler = createWorkflowOccurrenceScheduler(
                    settings,
                    diagnosticsService,
                  );
                } else {
                  diagnosticsService.recordError(workflowInitialization.diagnostic);
                }

                const hadWorkspaceMetadata =
                  (await workspacesStore.list()).workspaces.length > 0;
                await migrateLegacyProjectsToWorkspaces();
                await workspacesStore.ensureDefaultWorkspace({
                  activate:
                    !hadWorkspaceMetadata || resolveChatBackendMode() === "fake",
                });
                await startDelegationBridge();
                await ensureChatAdapter(settings, diagnosticsService);
                await rehydrateWorkflowRuns();
              },
            });

            backendInitializationPromise = startup.backendReady.then((timings) => {
              if (process.env.PI_DECK_STARTUP_METRICS === "1") {
                console.info(
                  `[startup] shell-ready=${timings.shellReadyMs}ms backend-ready=${timings.backendReadyMs}ms`,
                );
              }
            });
            await backendInitializationPromise;
          }

          function createMainWindow(): void {'''
          text, count = bootstrap_pattern.subn(bootstrap_replacement, text, count=1)
          assert count == 1, f'bootstrap replacement count={count}'

          handler_old = '''    handler: async () => getAppBootstrapState(store, diagnosticsService),
          '''
          handler_new = '''    handler: async () => {
              const backendReady = backendInitializationPromise;
              if (backendReady === undefined) {
                throw new Error("Pi Deck backend initialization has not started.");
              }
              await backendReady;
              return getAppBootstrapState(store, diagnosticsService);
            },
          '''
          assert text.count(handler_old) == 1, 'bootstrap IPC handler anchor missing'
          text = text.replace(handler_old, handler_new, 1)
          path.write_text(text)

          Path('.github/workflows/apply-issue-51.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: paint shell before backend initialization"
          git push origin HEAD:perf/issue-51-progressive-startup
