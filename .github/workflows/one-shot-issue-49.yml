name: One-shot issue 49 patch

on:
  push:
    branches:
      - fix/issue-49-stable-sidebar-order

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-49-stable-sidebar-order
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply deterministic sidebar ordering fix
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("src/renderer/App.tsx")
          app = app_path.read_text()
          replacements = {
              "needsInput: newestFirst(inbox.needsInput),": "needsInput: inbox.needsInput,",
              "errors: newestFirst(inbox.errors),": "errors: inbox.errors,",
              "working: newestFirst(inbox.working),": "working: inbox.working,",
              "queued: newestFirst(inbox.queued),": "queued: inbox.queued,",
              "attached: newestFirst(inbox.attached),": "attached: inbox.attached,",
          }
          for old, new in replacements.items():
              if app.count(old) != 1:
                  raise SystemExit(f"expected one {old!r}, found {app.count(old)}")
              app = app.replace(old, new)
          anchor = "    needsInput: inbox.needsInput,"
          comment = """    // Preserve source order inside live status buckets. Runtime events update
            // `updatedAtMs` continuously; recency-sorting these rows makes navigation
            // jump under the pointer. Initial hydration defines the deterministic
            // starting order, while meaningful status transitions still move rows.
            needsInput: inbox.needsInput,"""
          if app.count(anchor) != 1:
              raise SystemExit("sidebar comment anchor changed")
          app_path.write_text(app.replace(anchor, comment))

          test_path = Path("src/renderer/App.test.ts")
          tests = test_path.read_text()
          marker = 'it("only materializes the Work inbox model while Work is visible", () => {'
          if tests.count(marker) != 1:
              raise SystemExit("App test insertion marker changed")
          regression = '''it("keeps live sidebar buckets in source order while idle saved rows use recency", () => {
            const liveSession = (id: string, updatedAtMs: number) => ({
              id,
              title: id,
              subtitle: "Working",
              project: "Project",
              projectPath: "/tmp/project",
              status: "working",
              updatedAt: "Now",
              updatedAtMs,
              timeline: [],
              baseState: "working",
              overlays: { ...emptyOverlays },
              runtimeBacked: true,
            });
            const savedSession = (id: string, updatedAtMs: number) => ({
              ...liveSession(id, updatedAtMs),
              status: "idle",
              baseState: "idle",
              runtimeBacked: false,
            });

            const first = liveSession("first", 300);
            const second = liveSession("second", 100);
            expect(
              __rendererTestHooks
                .buildRealSessionInbox([first, second] as any, "")
                .working.map((session: any) => session.id),
            ).toEqual(["first", "second"]);

            expect(
              __rendererTestHooks
                .buildRealSessionInbox(
                  [first, { ...second, updatedAtMs: 400 }] as any,
                  "",
                )
                .working.map((session: any) => session.id),
            ).toEqual(["first", "second"]);

            expect(
              __rendererTestHooks
                .buildRealSessionInbox(
                  [savedSession("older", 100), savedSession("newer", 200)] as any,
                  "",
                )
                .idleSaved.map((session: any) => session.id),
            ).toEqual(["newer", "older"]);
          });

          '''
          tests = tests.replace(marker, regression + marker)
          old_expectation = '''expect(inbox.working.map((session: any) => session.id)).toEqual([
                "working-new",
                "working-old",
              ]);'''
          if tests.count(old_expectation) != 1:
              raise SystemExit(
                  f"expected one old working-order assertion, found {tests.count(old_expectation)}"
              )
          tests = tests.replace(
              old_expectation,
              '''expect(inbox.working.map((session: any) => session.id)).toEqual([
                "working-old",
                "working-new",
              ]);''',
          )
          test_path.write_text(tests)

          style_path = Path("src/renderer/styles.css")
          styles = style_path.read_text()
          style_anchor = ".session-item {\n  display: grid;"
          if styles.count(style_anchor) != 1:
              raise SystemExit(
                  f"expected one session layout anchor, found {styles.count(style_anchor)}"
              )
          style_path.write_text(
              styles.replace(
                  style_anchor,
                  ".session-item {\n  display: grid;\n  min-height: 46px;",
              )
          )
          PY
      - run: npx prettier --write src/renderer/App.tsx src/renderer/App.test.ts src/renderer/styles.css
      - run: npm test -- --run src/renderer/App.test.ts
      - name: Commit final patch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-issue-49.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize sidebar session ordering"
          git push origin HEAD:fix/issue-49-stable-sidebar-order
