name: One-shot issue 35 patch
on:
  push:
    branches: [fix/issue-35-workflow-switcher-layout]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-35-workflow-switcher-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch current workflow scope control
        run: |
          python -c 'from pathlib import Path; p=Path("src/renderer/components/workflows/AgentWorkflowBuilder.tsx"); s=p.read_text(); old="<label className=\"workflow-field\">\n              <span>Workflow scope</span>\n              <select\n                aria-label=\"Workflow scope\""; new="<label className=\"workflow-field workflow-scope-field\">\n              <span>Workflow scope</span>\n              <select\n                className=\"workflow-scope-select\"\n                aria-label=\"Workflow scope\""; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          printf '\n/* Keep long workflow workspace names bounded at narrow widths. */\n.workflow-scope-field {\n  min-width: 0;\n  max-width: 100%%;\n}\n\n.workflow-scope-select {\n  min-width: 0;\n  width: 100%%;\n  max-width: 100%%;\n  text-overflow: ellipsis;\n}\n' >> src/renderer/styles.css
      - run: npx prettier --write src/renderer/components/workflows/AgentWorkflowBuilder.tsx src/renderer/styles.css
      - run: npm test -- --run src/renderer/components/workflows/AgentWorkflowBuilder.test.ts
      - name: Commit final patch and remove helper
        run: |
          rm .github/workflows/one-shot-issue-35.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: contain workflow scope workspace labels"
          git push origin HEAD:fix/issue-35-workflow-switcher-layout
