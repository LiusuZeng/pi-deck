name: One-shot finalize issue 48
on:
  push:
    branches: [fix/issue-48-app-name]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-48-app-name
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write package.json scripts/electron-runtime.mjs scripts/electron-runtime.test.mjs scripts/launch-electron.mjs scripts/launch-built.mjs src/main/appIdentity.ts src/main/appIdentity.test.ts src/main/main.ts
      - run: npm test -- --run scripts/electron-runtime.test.mjs src/main/appIdentity.test.ts scripts/launch-built.test.mjs
      - name: Commit final formatting and remove helper
        run: |
          rm .github/workflows/one-shot-format-issue-48.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize issue 48 validation"
            git push origin HEAD:fix/issue-48-app-name
          fi
