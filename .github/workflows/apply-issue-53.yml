name: Apply issue 53 implementation

on:
  push:
    branches: [perf/issue-53-incremental-streaming]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/issue-53-incremental-streaming
      - name: Apply incremental-streaming implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          markdown_path = Path('src/renderer/markdown.ts')
          markdown = markdown_path.read_text()
          parser_anchor = '''export function parseInlineMarkdown(text: string): InlineToken[] {
          '''
          incremental_parser = '''export interface IncrementalMarkdownParserOptions {
            onParseSegment?(length: number): void;
          }

          export interface IncrementalMarkdownParser {
            parse(markdown: string): MarkdownBlock[];
            reset(): void;
          }

          /**
           * Keeps blank-line-delimited, already-finished Markdown blocks parsed
           * while reparsing only the mutable tail. Non-append edits fail back to
           * the canonical full parser, so final rendering and safety semantics
           * stay identical to parseSafeMarkdown().
           */
          export function createIncrementalMarkdownParser(
            options: IncrementalMarkdownParserOptions = {},
          ): IncrementalMarkdownParser {
            let previousSource = "";
            let stablePrefixEnd = 0;
            let stableBlocks: MarkdownBlock[] = [];

            const parseSegment = (segment: string): MarkdownBlock[] => {
              if (segment.length === 0) return [];
              options.onParseSegment?.(segment.length);
              return parseSafeMarkdown(segment);
            };

            const reset = (): void => {
              previousSource = "";
              stablePrefixEnd = 0;
              stableBlocks = [];
            };

            return {
              reset,
              parse(markdown) {
                const source = markdown.replace(/\\r\\n?/g, "\\n");
                if (!source.startsWith(previousSource)) {
                  reset();
                }

                const nextStablePrefixEnd = stableMarkdownPrefixEnd(source);
                if (nextStablePrefixEnd < stablePrefixEnd) {
                  reset();
                }

                if (nextStablePrefixEnd > stablePrefixEnd) {
                  stableBlocks = [
                    ...stableBlocks,
                    ...parseSegment(
                      source.slice(stablePrefixEnd, nextStablePrefixEnd),
                    ),
                  ];
                  stablePrefixEnd = nextStablePrefixEnd;
                }

                const tailBlocks = parseSegment(source.slice(stablePrefixEnd));
                previousSource = source;
                return [...stableBlocks, ...tailBlocks];
              },
            };
          }

          function stableMarkdownPrefixEnd(source: string): number {
            let offset = 0;
            let stableEnd = 0;
            let inFence = false;

            while (offset <= source.length) {
              const newline = source.indexOf("\\n", offset);
              const hasNewline = newline !== -1;
              const end = hasNewline ? newline : source.length;
              const line = source.slice(offset, end);

              if (inFence) {
                if (line.startsWith("```")) inFence = false;
              } else if (/^```[^`]*$/.test(line)) {
                inFence = true;
              } else if (line.trim().length === 0 && hasNewline) {
                stableEnd = end + 1;
              }

              if (!hasNewline) break;
              offset = end + 1;
            }

            return stableEnd;
          }

          export function parseInlineMarkdown(text: string): InlineToken[] {
          '''
          assert markdown.count(parser_anchor) == 1, 'markdown parser anchor missing'
          markdown = markdown.replace(parser_anchor, incremental_parser, 1)
          markdown_path.write_text(markdown)

          markdown_test_path = Path('src/renderer/markdown.test.ts')
          markdown_test = markdown_test_path.read_text()
          import_old = '''  isAllowedExternalHref,
            parseInlineMarkdown,
          '''
          import_new = '''  createIncrementalMarkdownParser,
            isAllowedExternalHref,
            parseInlineMarkdown,
          '''
          assert markdown_test.count(import_old) == 1, 'markdown test import anchor missing'
          markdown_test = markdown_test.replace(import_old, import_new, 1)
          final_brace = markdown_test.rfind('\n});\n')
          assert final_brace != -1, 'markdown test describe terminator missing'
          extra_tests = r'''

            it("reuses finalized blocks while a long Markdown response grows", () => {
              let parsedCharacters = 0;
              const parser = createIncrementalMarkdownParser({
                onParseSegment: (length) => {
                  parsedCharacters += length;
                },
              });
              const paragraphs = Array.from(
                { length: 160 },
                (_, index) =>
                  `## Section ${index}\n\nParagraph ${index} ${"content ".repeat(20)}`,
              );
              let streamed = "";
              for (const paragraph of paragraphs) {
                streamed += `${paragraph}\n\n`;
                parser.parse(streamed);
              }

              expect(parser.parse(streamed)).toEqual(parseSafeMarkdown(streamed));
              expect(parsedCharacters).toBeLessThan(streamed.length * 3);
            });

            it("falls back safely for replacements and keeps fenced blank lines mutable", () => {
              const parser = createIncrementalMarkdownParser();
              const partial = [
                "Intro",
                "",
                "```ts",
                "const first = 1;",
                "",
                "const second = 2;",
              ].join("\n");
              expect(parser.parse(partial)).toEqual(parseSafeMarkdown(partial));

              const completed = `${partial}\n```\n\nDone`;
              expect(parser.parse(completed)).toEqual(parseSafeMarkdown(completed));

              const replacement = "# Replaced\n\nSafe <script>text</script>";
              expect(parser.parse(replacement)).toEqual(
                parseSafeMarkdown(replacement),
              );
            });
          '''
          markdown_test = markdown_test[:final_brace] + extra_tests + markdown_test[final_brace:]
          markdown_test_path.write_text(markdown_test)

          app_path = Path('src/renderer/App.tsx')
          app = app_path.read_text()
          import_anchor = '''  isAllowedExternalHref,
            parsePlainTextAutolinks,
            parseSafeMarkdown,
          '''
          import_replacement = '''  createIncrementalMarkdownParser,
            isAllowedExternalHref,
            parsePlainTextAutolinks,
            parseSafeMarkdown,
          '''
          assert app.count(import_anchor) == 1, 'App markdown import anchor missing'
          app = app.replace(import_anchor, import_replacement, 1)

          presentation_pattern = re.compile(r'function timelinePresentationItems\(\n  items: readonly TimelineItem\[\],\n\): TimelinePresentationItem\[\] \{.*?\n\}\n\nfunction isActivityTimelineItem', re.S)
          match = presentation_pattern.search(app)
          assert match is not None, 'timeline presentation function missing'
          original = match.group(0)
          original_function = original[:-len('\n\nfunction isActivityTimelineItem')]
          incremental_projection = original_function + r'''

          type TimelinePresentationProjectorOptions = {
            onProjectRange?(startIndex: number, itemCount: number): void;
          };

          /**
           * Live runtime updates preserve immutable history and replace/append the
           * mutable tail. Reuse every completed presentation group before that
           * tail; snapshot/session replacements fail back to a full projection.
           */
          function createTimelinePresentationProjector(
            options: TimelinePresentationProjectorOptions = {},
          ): { project(items: readonly TimelineItem[]): TimelinePresentationItem[] } {
            let previousSource: readonly TimelineItem[] = [];
            let previousPresentation: TimelinePresentationItem[] = [];

            return {
              project(items) {
                if (items.length === 0) {
                  previousSource = items;
                  previousPresentation = [];
                  options.onProjectRange?.(0, 0);
                  return [];
                }

                const previousTailStart = timelinePresentationTailStart(previousSource);
                const canReusePrefix =
                  previousSource.length > 1 &&
                  previousTailStart > 0 &&
                  items.length >= previousTailStart &&
                  items[0] === previousSource[0] &&
                  items[previousTailStart - 1] ===
                    previousSource[previousTailStart - 1];
                const restartIndex = canReusePrefix ? previousTailStart : 0;
                options.onProjectRange?.(
                  restartIndex,
                  Math.max(0, items.length - restartIndex),
                );

                const projectedTail = timelinePresentationItems(
                  items.slice(restartIndex),
                );
                const presentation = canReusePrefix
                  ? [...previousPresentation.slice(0, -1), ...projectedTail]
                  : projectedTail;
                previousSource = items;
                previousPresentation = presentation;
                return presentation;
              },
            };
          }

          function timelinePresentationTailStart(
            items: readonly TimelineItem[],
          ): number {
            if (items.length === 0) return 0;
            let index = items.length - 1;
            if (!isActivityTimelineItem(items[index]!)) return index;
            while (index > 0 && isActivityTimelineItem(items[index - 1]!)) {
              index -= 1;
            }
            return index;
          }

          function isActivityTimelineItem'''
          app = app[:match.start()] + incremental_projection + app[match.end():]

          marker_pattern = re.compile(r'function getTimelineScrollMarker\(session: SessionViewModel\): string \{.*?\n\}\n\nfunction StarterPage', re.S)
          marker_replacement = r'''function getTimelineScrollMarker(session: SessionViewModel): string {
            // Scroll ownership only needs the mutable end of the transcript. Keep
            // the marker bounded so a token delta never serializes all history.
            const timelineMarker = session.timeline
              .slice(-12)
              .map((item) => {
                if (item.kind === "tool") {
                  return `${item.id}:${item.status}:${item.summary.length}:${item.details.length}`;
                }
                return `${item.id}:${item.kind}:${"content" in item ? item.content.length : 0}`;
              })
              .join("|");

            return `${session.id}|${session.status}|${session.baseState}|${session.overlays.streaming}|${session.overlays.toolRunning}|${session.timeline.length}|${timelineMarker}`;
          }

          function StarterPage'''
          app, count = marker_pattern.subn(marker_replacement, app, count=1)
          assert count == 1, f'scroll marker replacement count={count}'

          chat_old = '''  const presentationItems = useMemo(
              () => timelinePresentationItems(props.session.timeline),
              [props.session.timeline],
            );
            const timelineScrollMarker = getTimelineScrollMarker(props.session);
          '''
          chat_new = '''  const presentationProjectorRef = useRef<
              ReturnType<typeof createTimelinePresentationProjector> | undefined
            >(undefined);
            if (presentationProjectorRef.current === undefined) {
              presentationProjectorRef.current = createTimelinePresentationProjector();
            }
            const presentationItems = useMemo(
              () =>
                presentationProjectorRef.current!.project(props.session.timeline),
              [props.session.timeline],
            );
            const timelineScrollMarker = getTimelineScrollMarker(props.session);
          '''
          assert app.count(chat_old) == 1, 'ChatTimeline projection anchor missing'
          app = app.replace(chat_old, chat_new, 1)

          markdown_view_old = '''export function MarkdownView(props: { markdown: string }): ReactElement {
            const blocks = useMemo(
              () => parseSafeMarkdown(props.markdown),
              [props.markdown],
            );
          '''
          markdown_view_new = '''export function MarkdownView(props: { markdown: string }): ReactElement {
            const parserRef = useRef<
              ReturnType<typeof createIncrementalMarkdownParser> | undefined
            >(undefined);
            if (parserRef.current === undefined) {
              parserRef.current = createIncrementalMarkdownParser();
            }
            const blocks = useMemo(
              () => parserRef.current!.parse(props.markdown),
              [props.markdown],
            );
          '''
          assert app.count(markdown_view_old) == 1, 'MarkdownView anchor missing'
          app = app.replace(markdown_view_old, markdown_view_new, 1)

          hooks_old = '''  timelinePresentationItems,
            activityMilestones,
          '''
          hooks_new = '''  timelinePresentationItems,
            createTimelinePresentationProjector,
            getTimelineScrollMarker,
            activityMilestones,
          '''
          assert app.count(hooks_old) == 1, 'renderer test hook anchor missing'
          app = app.replace(hooks_old, hooks_new, 1)
          app_path.write_text(app)

          app_test_path = Path('src/renderer/App.test.ts')
          app_test = app_test_path.read_text()
          extra = r'''

          describe("incremental timeline projection", () => {
            it("reprojects only the mutable tail while immutable history is shared", () => {
              const ranges: Array<[number, number]> = [];
              const projector =
                __rendererTestHooks.createTimelinePresentationProjector({
                  onProjectRange: (startIndex: number, itemCount: number) =>
                    ranges.push([startIndex, itemCount]),
                });
              const history = Array.from({ length: 120 }, (_, index) => ({
                id: `history-${index}`,
                kind: "user",
                content: `history ${index}`,
                createdAt: "00:00",
              })) as any[];

              projector.project(history as any);
              const streaming = [
                ...history,
                {
                  id: "streaming-answer",
                  kind: "assistant",
                  content: "hello",
                  createdAt: "00:01",
                  streaming: true,
                },
              ] as any[];
              projector.project(streaming as any);
              const next = [
                ...streaming.slice(0, -1),
                { ...streaming.at(-1), content: "hello world" },
              ] as any[];
              const incremental = projector.project(next as any);

              expect(incremental).toEqual(
                __rendererTestHooks.timelinePresentationItems(next as any),
              );
              expect(ranges[0]).toEqual([0, 120]);
              expect(ranges.at(-1)?.[0]).toBeGreaterThan(110);
              expect(ranges.at(-1)?.[1]).toBeLessThan(5);
            });

            it("keeps the scroll marker bounded for very long transcripts", () => {
              const timeline = Array.from({ length: 500 }, (_, index) => ({
                id: `message-${index}`,
                kind: "assistant",
                content: "x".repeat(200),
                createdAt: "00:00",
              }));
              const marker = __rendererTestHooks.getTimelineScrollMarker({
                id: "long-session",
                status: "working",
                baseState: "working",
                overlays: { streaming: true, toolRunning: false },
                timeline,
              } as any);

              expect(marker.length).toBeLessThan(1_000);
              expect(marker).toContain("|500|");
            });
          });
          '''
          app_test_path.write_text(app_test + extra)

          Path('.github/workflows/apply-issue-53.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: make streaming derivation incremental"
          git push origin HEAD:perf/issue-53-incremental-streaming
