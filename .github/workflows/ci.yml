name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify desktop app
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format draft and show diff
        run: |
          npx prettier --write src/main/main.ts src/main/workspaces/workspaceUsage.ts src/main/workspaces/workspaceUsage.test.ts
          git diff -- src/main/main.ts src/main/workspaces/workspaceUsage.ts src/main/workspaces/workspaceUsage.test.ts
      - run: npm run verify:ci
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
