name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  PI_CODING_AGENT_VERSION: "0.85.0"

jobs:
  verify:
    name: Verify desktop app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Pi CLI for real integration coverage
        run: |
          npm install --global --ignore-scripts "@earendil-works/pi-coding-agent@${PI_CODING_AGENT_VERSION}"
          PI_BINARY="$(command -v pi)"
          test -x "$PI_BINARY"
          echo "PI_DECK_PI_BINARY=$PI_BINARY" >> "$GITHUB_ENV"
          "$PI_BINARY" --version
      - name: Run authoritative validation
        run: npm run verify:ci
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
