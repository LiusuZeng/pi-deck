<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222831"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4f8df7"/>
      <stop offset="1" stop-color="#1f5fc9"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5b6678"/>
      <stop offset="1" stop-color="#303846"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity=".42"/>
    </filter>
