  <rect x="80" y="80" width="864" height="864" rx="190" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(512 512)">
    <rect x="-210" y="-285" width="420" height="570" rx="58" fill="url(#slate)" transform="rotate(14) translate(72 28)"/>
    <rect x="-210" y="-285" width="420" height="570" rx="58" fill="url(#blue)" transform="rotate(5) translate(34 10)"/>
    <rect x="-210" y="-285" width="420" height="570" rx="58" fill="url(#paper)" transform="rotate(-13)"/>
  </g>
